name: Update APK from Telegram Bot

on:
  repository_dispatch:
    types: [update-apk]

jobs:
  update-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Download APK from Telegram
        run: |
          curl -o MParivahan.apk "${{ github.event.client_payload.apk_url }}"
      
      - name: Commit and push APK
        run: |
          git config --global user.name 'MPari Bot'
          git config --global user.email 'bot@mpari.dev'
          git add MParivahan.apk
          git commit -m "Update APK: ${{ github.event.client_payload.version }}"
          git push
